[project]
name = "smart-retail-intelligence"
version = "0.1.0"
description = "Local-first retail data engineering, DuckDB/PostgreSQL analytics, Power BI serving, and grounded Groq GenAI platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "faker>=24.0.0",
    "requests>=2.31.0",
    "pyspark>=3.5.1",
    "pyarrow>=15.0.0",
    "duckdb>=1.1.0",
    "sqlalchemy>=2.0.29",
    "psycopg2-binary>=2.9.9",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "groq>=0.9.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["src/tests"]